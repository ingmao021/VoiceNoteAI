<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Preview — Smartwatch UI (verde #cbfe00 / azul #009bfe)</title>
<style>
  :root{
    --bg:#000000;
    --surface-container:#1b1d17;
    --surface-container-high:#26291f;
    --on-surface:#e4e6d8;
    --on-surface-variant:#c5c8b8;
    --outline:#8f9284;
    --primary:#cbfe00;           --on-primary:#0e1400;
    --primary-container:#2b3600; --on-primary-container:#e6ff80;
    --secondary:#009bfe;         --on-secondary:#00131f;
    --secondary-container:#00344f; --on-secondary-container:#9ed6ff;
    --error:#ffb4ab;             --on-error:#690005;
    --font: "Google Sans Flex","Roboto Flex","Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;flex-wrap:wrap;padding:48px;
       font-family:var(--font);
       background:radial-gradient(ellipse at 30% 30%,#2a3b00 0%,transparent 55%),radial-gradient(ellipse at 75% 70%,#00385c 0%,transparent 60%),#0b0d08;}
  .scale{zoom:2}
  /* Bisel / carcasa */
  .watch{width:249px;height:249px;border-radius:50%;padding:12px;
         background:radial-gradient(circle at 50% 18%,#3a3a3a 0%,#111 45%,#050505 100%);
         box-shadow:0 18px 40px rgba(0,0,0,.55), inset 0 2px 3px rgba(255,255,255,.08);}
  /* Pantalla 225dp */
  .screen{position:relative;width:225px;height:225px;border-radius:50%;background:var(--bg);overflow:hidden;
          display:flex;flex-direction:column;align-items:center;}
  .sys-icon{margin-top:12px;width:24px;height:24px;border-radius:50%;background:var(--primary);display:grid;place-items:center}
  .sys-icon svg{width:16px;height:16px;fill:var(--on-primary)}
  .title{margin-top:4px;font-size:15px;font-weight:600;color:var(--on-surface);letter-spacing:.1px}
  .ic{width:24px;height:24px;fill:currentColor}

  /* Chip / Button con avatar */
  .stack{display:flex;flex-direction:column;gap:4px;margin-top:6px;width:84%}
  .chip{height:52px;border-radius:26px;background:var(--secondary-container);color:var(--on-secondary-container);
        display:flex;align-items:center;gap:8px;padding:0 14px 0 8px;}
  .avatar{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
  .a1{background:var(--primary);color:var(--on-primary)}
  .a2{background:var(--secondary);color:var(--on-secondary)}
  .txt{min-width:0}
  .l1{font-size:14px;font-weight:600;color:#e6f4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .l2{font-size:12px;color:var(--on-secondary-container);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Button group de 3 */
  .group{display:flex;gap:4px;margin-top:6px;width:84%;height:96px}
  .gbtn{flex:1;border-radius:28px;display:grid;place-items:center;background:var(--secondary);color:var(--on-secondary)}
  .gbtn.sel{background:var(--primary);color:var(--on-primary);border-radius:18px}
  .gbtn svg{width:28px;height:28px;fill:currentColor}

  /* Edge button (abraza el borde inferior) */
  .edge{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
        width:108px;height:46px;display:grid;place-items:center;padding-bottom:4px;
        border-radius:22px 22px 54px 54px / 20px 20px 34px 34px;
        font-size:15px;font-weight:600}
  .edge.primary{background:var(--primary);color:var(--on-primary)}
  .edge.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
  .edge svg{width:26px;height:26px;fill:currentColor}

  /* Anillo de progreso */
  .ring{position:absolute;inset:0}
  .metric{margin-top:18px;text-align:center}
  .big{font-size:40px;font-weight:600;color:var(--on-surface);line-height:1}
  .unit{font-size:12px;color:var(--on-surface-variant);margin-top:2px}
  .pills{display:flex;gap:4px;margin-top:10px}
  .pill{display:flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:14px;background:var(--surface-container);color:var(--on-surface);font-size:12px;font-weight:600}
  .pill svg{width:16px;height:16px}
  .pill .g{fill:var(--primary)} .pill .b{fill:var(--secondary)}
  .caption{color:#c5c8b8;font:500 13px/1.4 var(--font);text-align:center;margin-top:14px}
</style>
</head>
<body>

</svg>

    <div class="sys-icon"><svg><use href="#i-bolt"/></svg></div>
    <div class="stack" style="margin-top:10px">
      <div class="chip"><div class="avatar a1">KM</div><div class="txt"><div class="l1">Katlego Moeketsi</div><div class="l2">¡Sí! Lo olvidé por completo</div></div></div>
